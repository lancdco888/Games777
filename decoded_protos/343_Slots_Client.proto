package PB.Slots_Client;

message MagicPearlNormalRet {
    optional NormalSpin normalSpin = 1;
}

message MagicPearlFreeRet {
    optional FreeSpin freeSpin = 1;
}

message MagicPearlSpecialRet {
    optional SpecialSpin specialSpin = 1;
}

message MagicPearlEnterResumed {
    optional int32 lvID = 1;
    optional int64 currentBetMoney = 2;
    optional Enter_Success enterBase = 3;
    optional MagicPearlNormalRet resumedNormal = 4;
    optional MagicPearlFreeRet resumedFree = 5;
    optional MagicPearlSpecialRet resumedSpecial = 6;
    optional int32 lastMsgType = 7;
    optional int64 accumulativeWin = 8;
}
