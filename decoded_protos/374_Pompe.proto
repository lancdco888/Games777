// 📄 Source: 374_Pompe.proto
package PB.Pompe;

message Cell {
    optional int32 index = 1;
    optional int32 icon = 2;
}

message Line {
    optional int32 lineIndex = 1;
    optional int64 winCoin = 2;
    optional int32 icon = 3;
    repeated Cell lineCells = 4;
}

message NormalSpin {
    optional int64 betMoney = 1;
    optional SlotMoneyGift slotMoneyGift = 2;
    optional SlotMoney slotMoney = 3;
    optional int64 levelUpMoney = 4;
    repeated int64 levelUpMoneys = 5;
    repeated Cell grids = 6;
    repeated Line lines = 7;
    optional int32 gotFreeTimes = 8;
    optional int64 curWinCoin = 9;
}

message FreeSpin {
    optional int64 betMoney = 1;
    optional SlotMoneyGift slotMoneyGift = 2;
    optional SlotMoney slotMoney = 3;
    repeated Cell grids = 4;
    repeated Line lines = 5;
    optional int32 gotFreeTimes = 6;
    optional int64 curWinCoin = 7;
    optional int32 freeGameTotalCount = 8;
    optional int32 freeGameCurCount = 9;
}
