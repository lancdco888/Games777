package PB.Slots_Client;

message CoinComboMouse_NormalRet {
    optional NormalSpin normalSpin = 1;
}

message CoinComboMouse_FreeTypeRet {
    optional FreeSpinType freeSpinType = 1;
}

message CoinComboMouse_FreeRet {
    optional FreeSpin freeSpin = 1;
}

message CoinComboMouse_SpecialSpinRet {
    optional SpecialSpin specialSpin = 1;
}

message CoinComboMouse_EnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional CoinComboMouse_NormalRet resumedNormal = 4;
    optional CoinComboMouse_FreeRet resumedFree = 5;
    optional CoinComboMouse_FreeTypeRet resumedFreeType = 6;
    optional CoinComboMouse_SpecialSpinRet specialRet = 7;
    optional int32 type = 8;
    optional int64 MoneyA = 11;
    optional int64 MoneyB = 12;
    repeated int32 cells = 13;
    optional int32 lvID = 14;
    repeated int32 freeCells = 15;
}
