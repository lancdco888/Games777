package PB.Slots_Client;

message LotteryPhoenixNormalRet {
    optional NormalSpin normalSpin = 1;
}

message LotteryPhoenixFreeRetType {
    optional FreeType freeType = 1;
}

message LotteryPhoenixFreeRet {
    optional FreeSpin freeSpin = 1;
}

message LotteryPhoenixEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional LotteryPhoenixNormalRet resumedNormal = 4;
    optional LotteryPhoenixFreeRet resumedFree = 5;
    optional LotteryPhoenixFreeRetType freeType = 6;
    optional int32 type = 7;
    optional int32 freetime = 8;
    repeated int32 cells = 9;
    optional int32 lvID = 10;
}
