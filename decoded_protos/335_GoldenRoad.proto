// 📄 Source: 335_GoldenRoad.proto
package PB.GoldenRoad;

message Cell {
    optional int32 index = 1;
    optional int32 icon = 2;
}

message JackPot {
    optional int32 index = 1;
    optional int32 spType = 2;
    optional int64 money = 3;
}

message Line {
    optional int32 lineIndex = 1;
    optional int64 winCoin = 2;
    optional int32 icon = 3;
    repeated Cell lineCells = 4;
    repeated JackPot lineJackPots = 5;
}

message NormalSpin {
    optional int64 bet = 1;
    optional int64 curWinCoin = 2;
    repeated Cell grids = 3;
    repeated Line lines = 4;
    optional int32 intoSpec = 5;
    optional int32 specTime = 6;
    optional int32 intoSpecMakeUp = 7;
    optional int32 intoCollect = 8;
    optional int32 lockStates = 9;
    optional int32 intoMustHitBy = 10;
    optional SlotMoneyGift slotMoneyGift = 11;
    optional SlotMoney slotMoney = 12;
    optional int64 levelUpMoney = 13;
    repeated int64 levelUpMoneys = 14;
}

message SpecSpin {
    optional int64 bet = 1;
    optional int64 winCoin = 2;
    repeated Cell grids = 3;
    repeated Line lines = 4;
    optional int32 specTime = 5;
    optional int32 jpTypeMax = 6;
    optional SlotMoneyGift slotMoneyGift = 7;
    optional SlotMoney slotMoney = 8;
}
