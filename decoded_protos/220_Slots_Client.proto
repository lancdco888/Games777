package PB.Slots_Client;

message PandaTreasuresNormalRet {
    optional NormalSpin normalSpin = 1;
}

message PandaTreasuresFreeRetType {
    optional FreeType freeType = 1;
}

message PandaTreasuresFreeRet {
    optional FreeSpin freeSpin = 1;
}

message PandaTreasuresEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional PandaTreasuresNormalRet resumedNormal = 4;
    optional PandaTreasuresFreeRet resumedFree = 5;
    optional PandaTreasuresFreeRetType freeType = 6;
    optional int32 type = 7;
    optional int32 lvID = 8;
    repeated int32 cells = 9;
}
