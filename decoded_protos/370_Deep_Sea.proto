// ==============================================
// 📄 Source: 370_Deep_Sea.proto
package PB.DeepSea;

message Cell {
    optional int32 index = 1;
    optional int32 icon = 2;
    optional int32 symbolType = 3;
    optional int64 symbolValue = 4;
}

message Line {
    optional int32 lineIndex = 1;
    optional int64 winCoin = 2;
    optional int32 icon = 3;
    repeated Cell lineCells = 4;
}

message GridFall {
    optional int32 index = 1;
    optional int32 move = 2;
}

message GridMulti {
    optional int32 index = 1;
    optional int32 scale = 2;
    optional int64 money = 3;
}

message LottyWin {
    optional int32 symbolType = 1;
    optional int32 count = 2;
    optional int64 money = 3;
}

message NormalSpin {
    optional int64 betMoney = 1;
    optional SlotMoneyGift slotMoneyGift = 2;
    optional SlotMoney slotMoney = 3;
    optional int64 levelUpMoney = 4;
    repeated int64 levelUpMoneys = 5;
    repeated Cell grids = 6;
    repeated Line lines = 7;
    optional int64 winCoin = 8;
    optional int32 intoFree = 9;
    optional int32 intoSpecial = 10;
    optional int64 accumulativeNumberWin = 11;
    repeated LottyWin lottyWins = 12;
    repeated Cell endGrids = 13;
}

message FreeSpin {
    optional int64 betMoney = 1;
    optional SlotMoneyGift slotMoneyGift = 2;
    optional SlotMoney slotMoney = 3;
    repeated Cell grids = 4;
    repeated Line lines = 5;
    optional int64 winCoin = 6;
    optional int32 intoFree = 7;
    optional int32 intoSpecial = 8;
    optional int32 freeGameTotalCount = 9;
    optional int32 freeGameCurCount = 10;
    optional int64 accumulativeNumberWin = 11;
    repeated LottyWin lottyWins = 12;
    repeated Cell endGrids = 13;
}

message SpecialSpin {
    optional int64 betMoney = 1;
    optional SlotMoneyGift slotMoneyGift = 2;
    optional SlotMoney slotMoney = 3;
    repeated Cell grids = 4;
    repeated Line lines = 5;
    optional int64 winCoin = 6;
    optional int32 lottyGameRestCount = 7;
    optional int64 accumulativeNumberWin = 8;
    repeated LottyWin lottyWins = 9;
    repeated Cell endGrids = 10;
}
