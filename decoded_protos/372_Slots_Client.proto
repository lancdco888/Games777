package PB.Slots_Client;

message PigAndWolfNormalRet {
    optional NormalSpin normalSpin = 1;
}

message PigAndWolfFreeRet {
    optional FreeSpin freeSpin = 1;
}

message PigAndWolfSpecialRet {
    optional SpecialSpin specialSpin = 1;
}

message PigAndWolfEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional PigAndWolfNormalRet resumedNormal = 4;
    optional PigAndWolfFreeRet resumedFree = 5;
    optional PigAndWolfSpecialRet resumedSpecial = 6;
    optional int32 type = 7;
    optional int32 lvID = 8;
}
