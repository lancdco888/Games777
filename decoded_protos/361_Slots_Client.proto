package PB.Slots_Client;

message FortuneRabbitNormalRet {
    optional NormalSpin normalSpin = 1;
}

message FortuneRabbitFreeRet {
    optional FreeSpin freeSpin = 1;
}

message FortuneRabbitEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional FortuneRabbitNormalRet resumedNormal = 4;
    optional FortuneRabbitFreeRet resumedFree = 5;
    optional int32 type = 6;
    optional int32 lvID = 7;
}
