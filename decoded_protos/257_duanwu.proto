// 📄 Source: 257_duanwu.proto
package PB.DuanWu;

message Cell {
    optional int32 index = 1;
    optional int32 icon = 2;
    optional int32 wildbet = 3;
}

message Line {
    optional int32 lineIndex = 1;
    optional int64 winCoin = 2;
    optional int32 icon = 3;
    repeated Cell lineCells = 4;
    optional int32 caijintype = 5;
}

message NormalSpin {
    optional int64 bet = 1;
    optional int64 winCoin = 2;
    repeated Cell grids = 3;
    optional int32 intoFree = 4;
    optional int32 FreeTime = 5;
    repeated Line lines = 6;
    repeated int32 boxsbet = 7;
    optional SlotMoneyGift slotMoneyGift = 8;
    optional SlotMoney slotMoney = 9;
    optional int64 levelUpMoney = 10;
    repeated int64 levelUpMoneys = 11;
    optional int32 lockStates = 12;
}

message FreeSpin {
    optional int64 bet = 1;
    optional int64 winCoin = 2;
    repeated Cell grids = 3;
    optional int64 bonusWinCoin = 4;
    optional int32 allCount = 5;
    optional int32 totalCount = 6;
    optional int32 newFreeTime = 7;
    repeated Line lines = 8;
    repeated int32 boxsbet = 9;
    optional SlotMoneyGift slotMoneyGift = 10;
    optional SlotMoney slotMoney = 11;
    repeated int32 changewilds = 12;
    optional int32 lockStates = 13;
}
