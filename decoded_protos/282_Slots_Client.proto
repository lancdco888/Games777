package PB.Slots_Client;

message NvXiaNormalRet {
    optional NormalSpin normalSpin = 1;
}

message NvXiaFreeRet {
    optional FreeSpin freeSpin = 1;
}

message NvXiaSpecialRet {
    optional SpecialSpin specialSpin = 1;
}

message NvXiaEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional NvXiaNormalRet resumedNormal = 4;
    optional NvXiaFreeRet resumedFree = 5;
    optional NvXiaSpecialRet resumedSpecial = 6;
    optional int32 type = 7;
    optional int32 lvID = 10;
}
