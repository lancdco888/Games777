package PB.Slots_Client;

message EurekaReelBlastNormalRet {
    optional NormalSpin normalSpin = 1;
}

message EurekaReelBlastFreeRet {
    optional FreeSpin freeSpin = 1;
}

message EurekaReelBlastSpecialRet {
    optional SpecialSpin specialSpin = 1;
}

message EurekaReelBlastEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional EurekaReelBlastNormalRet resumedNormal = 4;
    optional EurekaReelBlastFreeRet resumedFree = 5;
    optional EurekaReelBlastSpecialRet resumedSpecial = 6;
    optional int32 type = 7;
    optional int32 lvID = 10;
}
