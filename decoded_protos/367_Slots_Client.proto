package PB.Slots_Client;

message TheGreatImmortalsNormalRet {
    optional NormalSpin normalSpin = 1;
}

message TheGreatImmortalsFreeRet {
    optional FreeSpin freeSpin = 1;
}

message TheGreatImmortalsSpecRet {
    optional SpecSpin specSpin = 1;
}

message TheGreatImmortalsEnterResumed {
    optional int32 lvID = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional Enter_Success enterBase = 4;
    optional TheGreatImmortalsNormalRet resumedNormal = 5;
    optional TheGreatImmortalsFreeRet resumedFree = 6;
    optional TheGreatImmortalsSpecRet resumedSpec = 7;
    optional int32 status = 8;
    repeated int32 cells = 9;
}
