// 📄 Source: 252_doubleBlessings.proto
package PB.DoubleBlessings;

message Cell {
    optional int32 index = 1;
    optional int32 icon = 2;
    optional int32 childIcon = 3;
}

message Line {
    optional int32 lineIndex = 1;
    optional int64 winCoin = 2;
    optional int32 icon = 3;
    repeated Cell lineCells = 4;
}

message NormalSpin {
    optional int64 bet = 1;
    optional int64 winCoin = 2;
    repeated Cell grids = 3;
    optional int32 intoFree = 4;
    optional int32 FreeTime = 5;
    repeated Line lines = 6;
    optional int32 intoCollect = 7;
    optional int32 lockStates = 8;
    optional SlotMoneyGift slotMoneyGift = 9;
    optional SlotMoney slotMoney = 10;
    optional int64 levelUpMoney = 11;
    repeated int64 levelUpMoneys = 12;
    optional int32 collectSpeed = 20;
}

message FreeSpin {
    optional int64 bet = 1;
    optional int64 winCoin = 2;
    repeated Cell grids = 3;
    repeated int32 showchild = 13;
    optional int64 bonusWinCoin = 4;
    optional int32 allCount = 5;
    optional int32 totalCount = 6;
    optional int32 newFreeTime = 7;
    repeated Line lines = 8;
    optional int32 intoCollect = 9;
    optional int32 lockStates = 10;
    optional SlotMoneyGift slotMoneyGift = 11;
    optional SlotMoney slotMoney = 12;
    optional int32 collectSpeed = 20;
}
