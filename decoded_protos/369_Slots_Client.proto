package PB.Slots_Client;

message MoneyIconsNormalRet {
    optional NormalSpin normalSpin = 1;
}

message MoneyIconsFreeRet {
    optional FreeSpin freeSpin = 1;
}

message MoneyIconsRewardRet {
    optional RewardSpin rewardSpin = 1;
}

message MoneyIconsEnterResumed {
    optional int32 lvID = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional Enter_Success enterBase = 4;
    optional MoneyIconsNormalRet resumedNormal = 5;
    optional MoneyIconsFreeRet resumedFree = 6;
    optional MoneyIconsRewardRet resumedReward = 7;
    optional int32 status = 8;
    repeated int32 cells = 9;
}
