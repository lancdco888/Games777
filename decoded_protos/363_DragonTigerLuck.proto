package PB.DragonTigerLuck;

message Cell {
    optional int32 index = 1;
    optional int32 icon = 2;
}

message Line {
    optional int32 lineIndex = 1;
    optional int64 winCoin = 2;
}

message NormalSpin {
    optional int64 bet = 1;
    optional int64 winCoin = 2;
    repeated Cell gridsA = 3;
    repeated Cell gridsB = 4;
    repeated Line lines = 5;
    optional int32 typeXX = 11;
    optional SlotMoneyGift slotMoneyGift = 6;
    optional SlotMoney slotMoney = 7;
    optional int64 levelUpMoney = 8;
    repeated int64 levelUpMoneys = 9;
}
