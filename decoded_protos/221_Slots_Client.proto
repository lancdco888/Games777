package PB.Slots_Client;

message AfricanBuffaloNormalRet {
    optional NormalSpin normalSpin = 1;
}

message AfricanBuffaloFreeRet {
    optional FreeSpin freeSpin = 1;
}

message AfricanBuffaloEnterResumed {
    optional Enter_Success enterBase = 1;
    optional int64 currentWinCoin = 2;
    optional int64 currentBetMoney = 3;
    optional AfricanBuffaloNormalRet resumedNormal = 4;
    optional AfricanBuffaloFreeRet resumedFree = 5;
    optional int32 type = 7;
    optional int32 lvID = 8;
}
